<section id="quotes" class="quotes-section">
  <h2 data-i18n="layout.quotes">Quotes</h2>
  <p class="quotes-intro" data-i18n="quotes.intro">
    I enjoy reading, so I keep a few lines here that I want to come back to.
  </p>
  <div class="quote-content" aria-live="polite">
    <blockquote id="quote-text"></blockquote>
    <p id="quote-author"></p>
  </div>
  <div class="note-bottom">
    <button id="draw-quote">
      <span data-i18n="quotes.draw">another quote </span
      ><span aria-hidden="true">↻</span>
    </button>
  </div>
</section>
